<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>页面走丢了 · 很好学</title>
<link rel="icon" href="/learning/diamond.webp">
<style>
:root{--green:#287f70;--green-hover:#206d60;--green-light:#edf4f1;--border:#e3e8e3;
--text:#000c;--text2:#0009;--text3:rgb(0 0 0 / 56%);font-family:system-ui,-apple-system,"PingFang SC","Microsoft Yahei",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:#f6f8f7;color:var(--text2);font-size:16px;line-height:1.7;padding:24px;text-align:center}
.gem{width:22px;height:22px;background:var(--green);border-radius:5px;transform:rotate(45deg);display:inline-block}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:var(--text);margin-bottom:28px}
.blocks{display:flex;gap:6px;margin-bottom:20px}
.blocks i{width:14px;height:14px;border-radius:3px;display:block}
.blocks i:nth-child(1){background:#287f70;opacity:.25}
.blocks i:nth-child(2){background:#287f70;opacity:.55}
.blocks i:nth-child(3){background:#287f70;opacity:.9}
.blocks i:nth-child(4){background:#287f70;opacity:.55}
.blocks i:nth-child(5){background:#287f70;opacity:.25}
h1{font-size:26px;color:var(--text);margin:0 0 8px}
p{margin:0 0 24px}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
.actions a{display:inline-block;padding:11px 26px;border-radius:12px;font-weight:600;text-decoration:none;font-size:15px}
.btn-primary{background:var(--green);color:#fff!important}
.btn-primary:hover{background:var(--green-hover)}
.btn-ghost{background:#fff;color:var(--green)!important;border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--green)}
.links{font-size:14px;color:var(--text3)}
.links a{color:var(--green);text-decoration:none;margin:0 10px}
.links a:hover{text-decoration:underline}
@media(max-width:480px){h1{font-size:22px}.actions a{padding:10px 20px}}
</style>
</head>
<body>
  <div class="brand"><span class="gem" aria-hidden="true"></span>很好学</div>
  <div class="blocks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <h1>这一页走丢了</h1>
  <p>方块世界这么大,页面偶尔也会迷路。<br>回到熟悉的地方,继续学英语吧。</p>
  <div class="actions">
    <a class="btn-primary" href="/">返回网站首页</a>
    <a class="btn-ghost" href="/learning/">免费体验学习</a>
  </div>
  <nav class="links" aria-label="站内导航">
    <a href="/library/words/">单词图鉴</a>
    <a href="/library/readings/">阅读图鉴</a>
    <a href="/library/scenes/">短语专题</a>
  </nav>
</body>
</html>
